# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "dab_premjit_trial"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalog:
    description: Catalog name
    default: demo
  schema:
    description: Schema name
    default: bakehouse

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f68b0279-5860.cloud.databricks.com
    variables:
      catalog: demo
      schema: bakehouse

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-f68b0279-5860.cloud.databricks.com
      # We always use /Users/talk.premjit@live.com for all resources to make sure we only have a single copy.
      root_path: /Users/talk.premjit@live.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as talk.premjit@live.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: talk.premjit@live.com
